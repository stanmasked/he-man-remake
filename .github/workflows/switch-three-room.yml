name: He-Man opt-in synthetic three-room Switch NRO
on:
  pull_request:
    paths:
      - '.github/workflows/switch-three-room.yml'
      - 'native/src/**'
      - 'native/include/**'
      - 'switch_raster/**'
      - 'raster/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-three-room:
    name: Cross-compile three-room training NRO with optional ZL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
      - name: Reject published commercial source files
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git ls-files | grep -Ei '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|png|jpe?g|ogg|wav|mp3|pvr)$'; then
            echo "Original game assets are forbidden in public CI" >&2
            exit 1
          fi
      - name: Compile actual opt-in variant
        shell: bash
        run: |
          set -euo pipefail
          make -C switch_raster clean all TARGET=heman_three_room_probe CHAIN_PROBE=1 THREE_ROOM_PROBE=1 AIR_SMASH_PROBE=1
          test -s switch_raster/heman_three_room_probe.elf
          test -s switch_raster/heman_three_room_probe.nro
          "$DEVKITA64/bin/aarch64-none-elf-readelf" -h switch_raster/heman_three_room_probe.elf | grep -F AArch64
          test "$(dd if=switch_raster/heman_three_room_probe.nro bs=1 skip=16 count=4 2>/dev/null)" = NRO0
          sha256sum switch_raster/heman_three_room_probe.nro
      - uses: actions/upload-artifact@v4
        with:
          name: heman-original-content-free-three-room-nro
          path: switch_raster/heman_three_room_probe.nro
          if-no-files-found: error
          retention-days: 7
