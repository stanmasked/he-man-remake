name: He-Man Stage260 runtime physics string census
on:
  pull_request:
    paths:
      - 'src/heman_tools/runtime_physics_string_census.py'
      - 'tests/test_runtime_physics_string_census.py'
      - 'docs/stage260-runtime-physics-string-census.md'
      - '.github/workflows/stage260-runtime-physics-string-census.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-runtime-string-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private commercial assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private source assets must not enter public CI" >&2
            exit 1
          fi
      - name: Run synthetic Stage260 regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_runtime_physics_string_census.py' -v
      - name: Write synthetic-only capability summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "schema": "heman-stage260-runtime-physics-string-ci-v1",
              "result": "synthetic_macho_string_tests_passed_not_original_evidence",
              "synthetic_macho_and_fabricated_strings_only": True,
              "original_ipa_loaded": False,
              "original_executable_loaded": False,
              "raw_original_strings_exported": False,
              "original_physics_resource_binding_verified": False,
              "original_collision_response_verified": False,
              "original_ios_gameplay_trace_compared": False,
              "native_switch_collision_import_authorized": False,
              "note": "Public CI tests bounded string classification only; no original assets or executable."
          }
          Path("build/stage260_synthetic_summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("STAGE260_SYNTHETIC_RUNTIME_STRING_SUMMARY_VALID")
          PY
      - name: Preserve synthetic Stage260 summary
        uses: actions/upload-artifact@v4
        with:
          name: heman-stage260-synthetic-runtime-string-census
          path: build/stage260_synthetic_summary.json
          if-no-files-found: error
          retention-days: 7
