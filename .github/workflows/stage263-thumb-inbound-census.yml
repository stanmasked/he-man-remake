name: He-Man Stage263 inbound Thumb call census
on:
  pull_request:
    paths:
      - 'src/heman_tools/thumb_inbound_census.py'
      - 'tests/test_thumb_inbound_census.py'
      - 'docs/stage263-thumb-inbound-census.md'
      - '.github/workflows/stage263-thumb-inbound-census.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-inbound-calls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private commercial assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private game assets must not enter public CI" >&2
            exit 1
          fi
      - name: Synthetic Stage263 regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_thumb_inbound_census.py' -v
      - name: Write evidence-limit report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "schema": "heman-stage263-inbound-bl-ci-v1",
              "result": "synthetic_inbound_bl_tests_passed_not_original_evidence",
              "synthetic_macho_and_calls_only": True,
              "original_executable_loaded": False,
              "original_callsite_offsets_or_symbol_names_exported": False,
              "reachable_original_control_flow_verified": False,
              "original_collision_response_verified": False,
              "original_collision_alpha_usage_verified": False,
              "native_switch_collision_import_authorized": False
          }
          Path("build/stage263_synthetic_summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heman-stage263-synthetic-inbound-bl-census
          path: build/stage263_synthetic_summary.json
          if-no-files-found: error
          retention-days: 7
