name: He-Man synthetic Switch raster build
on:
  push:
    branches: [main]
    paths:
      - 'raster/**'
      - 'switch_raster/**'
      - 'native/include/**'
      - 'native/src/**'
      - 'switch/source/**'
      - '.github/workflows/switch-raster-probe.yml'
  pull_request:
    paths:
      - 'raster/**'
      - 'switch_raster/**'
      - 'native/include/**'
      - 'native/src/**'
      - 'switch/source/**'
      - '.github/workflows/switch-raster-probe.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native-raster:
    name: Cross-compile graphical synthetic NRO
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary assets in Git tracking
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git ls-files | grep -Ei '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|png|jpe?g|ogg|wav|mp3|pvr)$'; then
            echo "No original media are allowed in public CI" >&2
            exit 1
          fi
      - name: Build independent RGBA8888 graphical probe
        shell: bash
        run: |
          set -euo pipefail
          make -C switch_raster clean all
      - name: Check output architecture and NRO0 container
        shell: bash
        run: |
          set -euo pipefail
          test -s switch_raster/heman_raster_probe.elf
          test -s switch_raster/heman_raster_probe.nro
          "$DEVKITA64/bin/aarch64-none-elf-readelf" -h switch_raster/heman_raster_probe.elf | grep -F AArch64
          test "$(dd if=switch_raster/heman_raster_probe.nro bs=1 skip=16 count=4 2>/dev/null)" = NRO0
          sha256sum switch_raster/heman_raster_probe.nro
          wc -c switch_raster/heman_raster_probe.nro
      - name: Upload independent graphical NRO
        uses: actions/upload-artifact@v4
        with:
          name: heman-synthetic-raster-nro
          path: switch_raster/heman_raster_probe.nro
          if-no-files-found: error
          retention-days: 7
