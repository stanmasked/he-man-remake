name: He-Man Stage256 cross-platform capture safety
on:
  pull_request:
    paths:
      - 'tools/stage231_capture_session.py'
      - 'tools/stage243_bounded_evidence.py'
      - 'tests/test_stage231_capture_session.py'
      - 'tests/test_stage243_bounded_evidence.py'
      - 'docs/stage256-cross-platform-capture-safety.md'
      - '.github/workflows/stage256-cross-platform-capture-safety.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: Capture safety on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private commercial assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private source assets must not enter public CI" >&2
            exit 1
          fi
      - name: Run Stage231 capture-session regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage231_capture_session.py' -v
      - name: Run Stage243 bounded evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage243_bounded_evidence.py' -v
      - name: Write synthetic platform capability summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import stage231_capture_session as stage231
          report = {
              "schema": "heman-stage256-cross-platform-capture-safety-v1",
              "result": "synthetic_platform_tests_passed_not_runtime_evidence",
              "platform": sys.platform,
              "descriptor_relative_io_supported": stage231._supports_descriptor_io(),
              "stage231_prepare_collect_tests_passed": True,
              "stage243_bounded_read_tests_passed": True,
              "real_emulator_launch_performed": False,
              "runtime_gpu_execution_attested": False,
              "gpu_capability_independently_verified": False,
              "original_ios_graphics_parity_attested": False,
              "note": "Synthetic temporary fixtures only; no original game resources or emulator."
          }
          Path("build/stage256_cross_platform_summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("STAGE256_SYNTHETIC_PLATFORM_SUMMARY_VALID")
          PY
      - name: Preserve synthetic Stage256 summary
        uses: actions/upload-artifact@v4
        with:
          name: heman-stage256-capture-safety-${{ matrix.os }}
          path: build/stage256_cross_platform_summary.json
          if-no-files-found: error
          retention-days: 7
