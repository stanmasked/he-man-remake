name: He-Man Stage264 Tile collision-shape field contract
on:
  pull_request:
    paths:
      - 'src/heman_tools/tile_collision_shape_field.py'
      - 'tests/test_tile_collision_shape_field.py'
      - 'docs/stage264-tile-shape-field-contract.md'
      - '.github/workflows/stage264-tile-shape-field-contract.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tile-shape-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private commercial assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private game assets must not enter public CI" >&2
            exit 1
          fi
      - name: Run fabricated Stage264 regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_tile_collision_shape_field.py' -v
      - name: Write synthetic-only summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {
              "schema": "heman-stage264-tile-shape-field-ci-v1",
              "result": "fabricated_tile_method_tests_passed_not_original_evidence",
              "fictional_macho_methods_and_thumb_encodings_only": True,
              "original_executable_loaded": False,
              "original_symbol_names_or_instruction_bytes_exported": False,
              "original_tile_collision_shape_resource_type_verified": False,
              "original_collision_alpha_usage_verified": False,
              "original_runtime_collision_response_verified": False,
              "native_switch_collision_import_authorized": False
          }
          Path("build/stage264_synthetic_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heman-stage264-synthetic-tile-member-field
          path: build/stage264_synthetic_summary.json
          if-no-files-found: error
          retention-days: 7
