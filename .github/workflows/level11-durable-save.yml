name: He-Man standalone lore lab persistent dual-slot save
on:
  pull_request:
    paths:
      - '.github/workflows/level11-durable-save.yml'
      - 'native/include/heman_level11_durable_save.h'
      - 'native/src/heman_level11_durable_save.c'
      - 'native/tests/test_level11_durable_save.c'
      - 'native/run_tests.sh'
      - 'switch_lore/Makefile'
      - 'switch_lore/source/main.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-simulated-cold-restarts:
    name: Dual-slot cold restart and corrupt-file fallback (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared persistent-save C99 and test REAL temp files
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          "$CC" -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I native/include \
            native/src/heman_core.c native/src/heman_mask.c \
            native/src/heman_level11_lore.c \
            native/src/heman_level11_native_contacts.c \
            native/src/heman_level11_native_session.c \
            native/src/heman_level11_snapshot.c \
            native/src/heman_level11_durable_save.c \
            native/src/heman_level11_lab.c \
            native/tests/test_level11_durable_save.c -lm \
            -o /tmp/heman-stage113-dual-save
          /tmp/heman-stage113-dual-save

  aarch64-switch-lore-lab-build:
    name: AArch64 Switch NRO with optional SD save support
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
      - name: Build real asset-free NRO (no original iOS resources)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -C switch_lore clean all
          test -s switch_lore/heman_level11_lore_lab.nro
          test "$(dd if=switch_lore/heman_level11_lore_lab.nro bs=1 skip=16 count=4 2>/dev/null)" = NRO0
          "$DEVKITA64/bin/aarch64-none-elf-readelf" -h switch_lore/heman_level11_lore_lab.elf | grep -F AArch64
          sha256sum switch_lore/heman_level11_lore_lab.nro
      - uses: actions/upload-artifact@v4
        with:
          name: heman-stage113-synthetic-lore-dualslot-nro
          path: switch_lore/heman_level11_lore_lab.nro
          if-no-files-found: error
          retention-days: 7
