name: Patched NeXium real guest Level1-1 lore lab HID, RAM and SD save/load probe
on:
  pull_request:
    paths:
      - '.github/workflows/nexium-patched-lore-lab.yml'
      - 'switch_lore/**'
      - 'native/src/heman_level11_*'
      - 'native/include/heman_level11_*'
      - 'tools/instrument_nexium_lore_lab.py'
      - 'tools/verify_nexium_lore_lab_hid.py'
      - 'tools/verify_nexium_lore_lab_pngs.py'
      - 'tools/verify_nexium_sd_disk_receipt.py'
      - 'tools/verify_nexium_cold_restart.py'
      - 'tools/verify_nexium_corrupt_cold_restore.py'
      - 'tools/verify_nexium_torn_slot_fallback.py'
      - 'tools/verify_nexium_divergent_journal_priority.py'
      - 'tests/test_nexium_cold_restart.py'
      - 'tests/test_nexium_corrupt_cold_restore.py'
      - 'tests/test_nexium_torn_slot_fallback.py'
      - 'tests/test_nexium_divergent_journal_priority.py'
      - 'tests/test_nexium_fd_fixture_reads.py'
      - 'tools/audit_switch_sd_journal.py'
      - 'tests/test_nexium_sd_disk_receipt.py'
      - 'tests/test_switch_sd_journal_audit.py'
      - 'tests/test_nexium_lore_lab_evidence.py'
      - 'tools/instrument_nexium_frames.py'
      - 'tools/verify_nexium_hid_publication.py'
      - 'tools/check_pinned_nexium_hid_source.py'
      - 'tools/check_pinned_nexium_lore_hid_source.py'
      - 'patches/nexium-nro-segment-file-origin.patch'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence-oracles-mock-only:
    name: Fail-closed guest evidence oracle tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Execute MOCK-ONLY HID/frame_rx evidence contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_lore_lab_evidence.py -v
      - name: Test independent disk receipts on synthetic host files
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_sd_disk_receipt.py -v
      - name: Test cross-process guest restoration oracle (MOCK ONLY)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_cold_restart.py -v
      - name: Test fault-injected independent-process guest oracle (MOCK ONLY)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_corrupt_cold_restore.py -v
      - name: Test newest-slot torn-journal cold recovery (MOCK ONLY)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_torn_slot_fallback.py -v
      - name: Test descriptor-relative source SD fixture reads (MOCK ONLY)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_fd_fixture_reads.py -v
      - name: Test two valid divergent-progress journal oracle (MOCK ONLY)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest discover -s tests -p test_nexium_divergent_journal_priority.py -v
      - name: No synthetic data qualifies as actual guest evidence
        run: |
          echo 'These tests use MOCK objects and synthetically generated logs.'
          echo 'Only the separate headless-guest-runner can attest real NeXium.'

  build-genuine-nros:
    name: Build minimal probe plus genuine lore lab NRO
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
      - name: Build independent homebrew probes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -C switch_minimal clean all
          make -C switch_lore clean all
          mkdir -p nros
          cp switch_minimal/heman_minimal_guest_probe.nro nros/
          cp switch_lore/heman_level11_lore_lab.nro nros/
          sha256sum nros/*.nro
      - uses: actions/upload-artifact@v4
        with:
          name: heman-lore-lab-probe-nros
          path: nros/*.nro
          if-no-files-found: error
          retention-days: 7

  headless-guest-runner:
    name: Compile patched NeXium and execute guest CPU/runner
    needs: [build-genuine-nros, evidence-oracles-mock-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      RUST_BACKTRACE: "1"
      NEXIUM_CPU_BACKEND: rustarmic
      NEXIUM_DEBUG_RUNNER_SECONDS: "150"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heman-lore-lab-probe-nros
          path: nros
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux development dependencies used by NeXium
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libibus-1.0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libboost-dev libvulkan1 mesa-vulkan-drivers python3-pil
      - name: Clone and patch exactly pinned upstream NeXium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium-upstream
          git -C /tmp/nexium-upstream init -q
          git -C /tmp/nexium-upstream remote add origin https://github.com/nexium-emu/nexium.git
          git -C /tmp/nexium-upstream fetch --depth 1 origin b6149f647f1b0824e450555beb6cfc16b6f0e075
          git -C /tmp/nexium-upstream checkout -q --detach FETCH_HEAD
          git -C /tmp/nexium-upstream submodule update --init --depth 1
          mkdir -p "$GITHUB_WORKSPACE/boot-evidence"
          # Verify the real pinned kernel knows the expected NPAD button bits,
          # HID 25ms polling and exact [hid-publish] event format BEFORE build.
          python3 "$GITHUB_WORKSPACE/tools/check_pinned_nexium_hid_source.py" \
            /tmp/nexium-upstream/nexium-kernel/src/hid_state.rs | \
            tee "$GITHUB_WORKSPACE/boot-evidence/pinned-kernel-hid-source.json"
          python3 "$GITHUB_WORKSPACE/tools/check_pinned_nexium_lore_hid_source.py" \
            /tmp/nexium-upstream/nexium-kernel/src/hid_state.rs | \
            tee "$GITHUB_WORKSPACE/boot-evidence/pinned-kernel-lore-buttons.json"
          git -C /tmp/nexium-upstream apply --check "$GITHUB_WORKSPACE/patches/nexium-nro-segment-file-origin.patch"
          git -C /tmp/nexium-upstream apply "$GITHUB_WORKSPACE/patches/nexium-nro-segment-file-origin.patch"
          python3 "$GITHUB_WORKSPACE/tools/instrument_nexium_lore_lab.py" /tmp/nexium-upstream/nexium-gui/src/debug_boot.rs
          # The new PNGs are guest frame_rx output, not Xvfb splash screenshots.
      - name: Compile genuine patched upstream debug_boot program
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nexium-upstream
          cargo build -p nexium-gui --bin debug_boot --no-default-features --features backend-rustarmic
          test -x target/debug/debug_boot
          cp target/debug/debug_boot "$GITHUB_WORKSPACE/boot-evidence/debug_boot"
          sha256sum "$GITHUB_WORKSPACE/boot-evidence/debug_boot"
      - name: Run bare libnx app with patched AArch64 CPU backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boot-evidence
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/minimal-debug-boot.log"
          export RUST_LOG="info,wgpu_core=warn"
          NRO="$PWD/nros/heman_minimal_guest_probe.nro"
          set +e
          timeout --kill-after=6s 85s boot-evidence/debug_boot "$NRO" rustarmic \
            >boot-evidence/minimal-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/minimal-exit-status.txt
          tail -n 80 boot-evidence/minimal-debug-boot.log || true
          if [ "$code" -ne 0 ]; then
            echo "Patched guest CPU boot failed with exit code $code" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("boot-evidence/minimal-debug-boot.log").read_text()
          for marker in ("Boot context initialized", "Initial PC:"):
              if marker not in log:
                  raise SystemExit(f"Missing critical guest boot evidence: {marker}")
          cycles = re.search(r"Total cycles:\s*(\d+)", log)
          svcs = re.search(r"Total SVCs:\s*(\d+)", log)
          if not cycles or not svcs:
              raise SystemExit("Guest CPU/SVC totals were not recorded")
          print("Minimal NRO retired instructions:", cycles.group(1))
          print("Minimal NRO system calls:", svcs.group(1))
          if int(cycles.group(1)) <= 0 or int(svcs.group(1)) <= 0:
              raise SystemExit("No real CPU/SVC progress after NeXium boot")
          print("PASS: patched NeXium executed minimal guest instructions")
          PY
      - name: Run unchanged lore-lab guest NRO using patched production runner
        shell: bash
        run: |
          set -euo pipefail
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/raster-runner.log"
          export HEMAN_FRAME_CAPTURE_DIR="$PWD/boot-evidence"
          export NEXIUM_HID_INJECT="$PWD/boot-evidence/guest-hid-input.txt"
          export NEXIUM_HID_INJECT_EXCLUSIVE="1"
          export NEXIUM_HID_TRACE="1"
          echo 'buttons=' > "$NEXIUM_HID_INJECT"
          export RUST_LOG="info,wgpu_core=warn"
          NRO="$PWD/nros/heman_level11_lore_lab.nro"
          sha256sum "$NRO" > boot-evidence/guest-nro-before.sha256
          set +e
          timeout --kill-after=6s 250s boot-evidence/debug_boot "$NRO" rustarmic runner \
            >boot-evidence/raster-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/raster-exit-status.txt
          tail -n 100 boot-evidence/raster-runner.log || true
          if [ "$code" -ne 0 ]; then
            echo "Patched graphical guest execution failed (status $code)" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("boot-evidence/raster-runner.log").read_text()
          if "Production runner complete" not in log:
              raise SystemExit("Runner never completed")
          matches = re.findall(r"cycles=(\d+) svcs=(\d+) frames=(\d+)", log)
          if not matches:
              raise SystemExit("No periodic guest execution reports")
          cycles = max(int(x[0]) for x in matches)
          svcs = max(int(x[1]) for x in matches)
          print(f"Patched guest ran: cycles={cycles}, svcs={svcs}")
          if cycles == 0 or svcs == 0:
              raise SystemExit("No CPU cycles/SVCs: cannot claim guest execution")
          frames = re.search(r"Production runner complete: frames=(\d+)", log)
          print("Runner guest frames:", int(frames.group(1)) if frames else "unknown")
          print("PASS: patched NeXium executed actual homebrew CPU instructions")
          PY
      - name: Verify pinned NeXium kernel truly consumed published guest HID edges
        shell: bash
        run: |
          set -euo pipefail
          # debug_boot's HEMAN_LORE_HID lines are *writes* to a file. Only
          # the real kernel [hid-publish] lines certify guest NPAD consumption.
          python3 tools/verify_nexium_lore_lab_hid.py \
            boot-evidence/raster-stdout.log | \
            tee boot-evidence/guest-lore-hid-publication-report.json
      - name: Verify actual lore-lab RAM/SD save attempts, fail-closed restore and collectible route via guest PNGs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum nros/heman_level11_lore_lab.nro > boot-evidence/guest-nro-after.sha256
          # Before stores an absolute path; after stores a relative path.
          # Hash the real guest NRO at both ends and compare only digests.
          # The previous greedy sed swallowed the digest along with the path.
          sha256sum --check boot-evidence/guest-nro-before.sha256
          test "$(awk '{print $1}' boot-evidence/guest-nro-before.sha256)" = \
               "$(awk '{print $1}' boot-evidence/guest-nro-after.sha256)"
          python3 tools/verify_nexium_lore_lab_pngs.py boot-evidence | tee boot-evidence/guest-lore-lab-report.json
          sha256sum nros/heman_level11_lore_lab.nro boot-evidence/raster-frame-*.png | tee boot-evidence/guest-frame-sha256.txt
      - name: Independently audit actual isolated emulator SD files after guest HUD result
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_nexium_sd_disk_receipt.py \
            --data-root "$PWD/boot-evidence/nexium-data" \
            --guest-report boot-evidence/guest-lore-lab-report.json \
            --out boot-evidence/guest-sd-disk-receipt.json
      - name: Close first runner and start independent guest process with RESTORE ONLY
        shell: bash
        run: |
          set -euo pipefail
          # The preceding first run fully exited before this distinct invocation.
          # Share ONLY the isolated emulator SD folder, not process RAM/HUD.
          mkdir -p boot-evidence/cold-restart
          export HEMAN_LORE_RESTART_PHASE=restore
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/cold-restart/raster-runner.log"
          export HEMAN_FRAME_CAPTURE_DIR="$PWD/boot-evidence/cold-restart"
          export NEXIUM_HID_INJECT="$PWD/boot-evidence/cold-restart/guest-hid-input.txt"
          export NEXIUM_HID_INJECT_EXCLUSIVE="1"
          export NEXIUM_HID_TRACE="1"
          export RUST_LOG="info,wgpu_core=warn"
          echo 'buttons=' > "$NEXIUM_HID_INJECT"
          sha256sum --check boot-evidence/guest-nro-before.sha256
          set +e
          timeout --kill-after=6s 250s boot-evidence/debug_boot \
            "$PWD/nros/heman_level11_lore_lab.nro" rustarmic runner \
            >boot-evidence/cold-restart/raster-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/cold-restart/raster-exit-status.txt
          tail -n 65 boot-evidence/cold-restart/raster-runner.log || true
          if [ "$code" -ne 0 ]; then
            echo "Independent cold guest process exited with $code" >&2
            exit 1
          fi
          sha256sum --check boot-evidence/guest-nro-before.sha256
      - name: Independently verify cross-process restore and unchanged physical emulator SD files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_nexium_lore_lab_hid.py \
            --cold-restart boot-evidence/cold-restart/raster-stdout.log | \
            tee boot-evidence/cold-restart/guest-lore-hid-publication-report.json
          python3 tools/verify_nexium_sd_disk_receipt.py \
            --data-root "$PWD/boot-evidence/nexium-data" \
            --guest-report boot-evidence/guest-lore-lab-report.json \
            --out boot-evidence/cold-restart/guest-sd-disk-receipt.json
          python3 tools/verify_nexium_cold_restart.py \
            boot-evidence boot-evidence/cold-restart \
            --initial-receipt boot-evidence/guest-sd-disk-receipt.json \
            --final-receipt boot-evidence/cold-restart/guest-sd-disk-receipt.json \
            --out boot-evidence/cold-restart/guest-cold-restart-report.json
      - name: Prepare isolated checksum-invalid emulator SD fixture (no original media)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boot-evidence/fault-restart
          python3 tools/verify_nexium_corrupt_cold_restore.py prepare \
            --source-root "$PWD/boot-evidence/nexium-data" \
            --target-root "$PWD/boot-evidence/fault-restart/nexium-data" \
            --initial-receipt boot-evidence/guest-sd-disk-receipt.json \
            --out boot-evidence/fault-restart/corrupt-fixture-manifest.json
      - name: Third independent guest process must reject corrupted SD without losing RAM state
        shell: bash
        run: |
          set -euo pipefail
          export HEMAN_LORE_RESTART_PHASE=restore
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/fault-restart/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/fault-restart/raster-runner.log"
          export HEMAN_FRAME_CAPTURE_DIR="$PWD/boot-evidence/fault-restart"
          export NEXIUM_HID_INJECT="$PWD/boot-evidence/fault-restart/guest-hid-input.txt"
          export NEXIUM_HID_INJECT_EXCLUSIVE="1"
          export NEXIUM_HID_TRACE="1"
          export RUST_LOG="info,wgpu_core=warn"
          echo 'buttons=' > "$NEXIUM_HID_INJECT"
          sha256sum --check boot-evidence/guest-nro-before.sha256
          set +e
          timeout --kill-after=6s 250s boot-evidence/debug_boot \
            "$PWD/nros/heman_level11_lore_lab.nro" rustarmic runner \
            >boot-evidence/fault-restart/raster-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/fault-restart/raster-exit-status.txt
          tail -n 65 boot-evidence/fault-restart/raster-runner.log || true
          if [ "$code" -ne 0 ]; then
            echo "Corrupted SD guest process failed to complete ($code)" >&2
            exit 1
          fi
          sha256sum --check boot-evidence/guest-nro-before.sha256
      - name: Independent fail-closed receipt of third guest and unchanged corrupted SD bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_nexium_lore_lab_hid.py \
            --cold-restart boot-evidence/fault-restart/raster-stdout.log | \
            tee boot-evidence/fault-restart/guest-lore-hid-publication-report.json
          python3 tools/verify_nexium_corrupt_cold_restore.py verify \
            --evidence-folder "$PWD/boot-evidence/fault-restart" \
            --target-root "$PWD/boot-evidence/fault-restart/nexium-data" \
            --manifest boot-evidence/fault-restart/corrupt-fixture-manifest.json \
            --out boot-evidence/fault-restart/guest-corrupt-sd-failure-report.json
      - name: Prepare separate older-valid and truncated-newer SD journal fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boot-evidence/torn-newest-restart
          python3 tools/verify_nexium_torn_slot_fallback.py prepare \
            --source-root "$PWD/boot-evidence/nexium-data" \
            --target-root "$PWD/boot-evidence/torn-newest-restart/nexium-data" \
            --first-receipt boot-evidence/guest-sd-disk-receipt.json \
            --out boot-evidence/torn-newest-restart/torn-newest-manifest.json
      - name: Fourth independent guest process restores older record after newest is truncated
        shell: bash
        run: |
          set -euo pipefail
          export HEMAN_LORE_RESTART_PHASE=restore
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/torn-newest-restart/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/torn-newest-restart/raster-runner.log"
          export HEMAN_FRAME_CAPTURE_DIR="$PWD/boot-evidence/torn-newest-restart"
          export NEXIUM_HID_INJECT="$PWD/boot-evidence/torn-newest-restart/guest-hid-input.txt"
          export NEXIUM_HID_INJECT_EXCLUSIVE="1"
          export NEXIUM_HID_TRACE="1"
          export RUST_LOG="info,wgpu_core=warn"
          echo 'buttons=' > "$NEXIUM_HID_INJECT"
          sha256sum --check boot-evidence/guest-nro-before.sha256
          set +e
          timeout --kill-after=6s 250s boot-evidence/debug_boot \
            "$PWD/nros/heman_level11_lore_lab.nro" rustarmic runner \
            >boot-evidence/torn-newest-restart/raster-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/torn-newest-restart/raster-exit-status.txt
          tail -n 65 boot-evidence/torn-newest-restart/raster-runner.log || true
          if [ "$code" -ne 0 ]; then
            echo "Torn-newest cold guest exited with $code" >&2
            exit 1
          fi
          sha256sum --check boot-evidence/guest-nro-before.sha256
      - name: Attest genuine older-slot fallback and immutable truncated newer record
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_nexium_lore_lab_hid.py \
            --cold-restart boot-evidence/torn-newest-restart/raster-stdout.log | \
            tee boot-evidence/torn-newest-restart/guest-lore-hid-publication-report.json
          python3 tools/verify_nexium_torn_slot_fallback.py verify \
            --first-evidence "$PWD/boot-evidence" \
            --cold-evidence "$PWD/boot-evidence/torn-newest-restart" \
            --target-root "$PWD/boot-evidence/torn-newest-restart/nexium-data" \
            --manifest boot-evidence/torn-newest-restart/torn-newest-manifest.json \
            --out boot-evidence/torn-newest-restart/guest-torn-slot-recovery-report.json
      - name: Prepare independent SD fixture with two valid but different-progress generations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boot-evidence/divergent-restart
          python3 tools/verify_nexium_divergent_journal_priority.py prepare \
            --source-root "$PWD/boot-evidence/nexium-data" \
            --target-root "$PWD/boot-evidence/divergent-restart/nexium-data" \
            --first-receipt boot-evidence/guest-sd-disk-receipt.json \
            --out boot-evidence/divergent-restart/divergent-sd-manifest.json
      - name: Fifth separate NeXium guest process must restore valid newer PARTIAL progress
        shell: bash
        run: |
          set -euo pipefail
          export HEMAN_LORE_RESTART_PHASE=restore
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/divergent-restart/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/divergent-restart/raster-runner.log"
          export HEMAN_FRAME_CAPTURE_DIR="$PWD/boot-evidence/divergent-restart"
          export NEXIUM_HID_INJECT="$PWD/boot-evidence/divergent-restart/guest-hid-input.txt"
          export NEXIUM_HID_INJECT_EXCLUSIVE="1"
          export NEXIUM_HID_TRACE="1"
          export RUST_LOG="info,wgpu_core=warn"
          echo 'buttons=' > "$NEXIUM_HID_INJECT"
          sha256sum --check boot-evidence/guest-nro-before.sha256
          set +e
          timeout --kill-after=6s 250s boot-evidence/debug_boot \
            "$PWD/nros/heman_level11_lore_lab.nro" rustarmic runner \
            >boot-evidence/divergent-restart/raster-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/divergent-restart/raster-exit-status.txt
          tail -n 65 boot-evidence/divergent-restart/raster-runner.log || true
          if [ "$code" -ne 0 ]; then
            echo "Divergent-progress cold guest exited with $code" >&2
            exit 1
          fi
          sha256sum --check boot-evidence/guest-nro-before.sha256
      - name: Independent real guest/NPAD and pixel oracle for newest DIFFERENT progress
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_nexium_lore_lab_hid.py \
            --cold-restart boot-evidence/divergent-restart/raster-stdout.log | \
            tee boot-evidence/divergent-restart/guest-lore-hid-publication-report.json
          python3 tools/verify_nexium_divergent_journal_priority.py verify \
            --first-evidence "$PWD/boot-evidence" \
            --cold-evidence "$PWD/boot-evidence/divergent-restart" \
            --target-root "$PWD/boot-evidence/divergent-restart/nexium-data" \
            --manifest boot-evidence/divergent-restart/divergent-sd-manifest.json \
            --out boot-evidence/divergent-restart/guest-divergent-priority-report.json
      - name: Upload logs and guest PNGs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heman-patched-nexium-lore-lab-logs
          path: |
            boot-evidence/*.log
            boot-evidence/*status.txt
            boot-evidence/*.png
            boot-evidence/guest-frame*.txt
            boot-evidence/guest-frame*.json
            boot-evidence/*nro*.sha256
            boot-evidence/guest-lore-lab-report.json
            boot-evidence/guest-sd-disk-receipt.json
            boot-evidence/guest-lore-hid-publication-report.json
            boot-evidence/pinned-kernel-hid-source.json
            boot-evidence/pinned-kernel-lore-buttons.json
            boot-evidence/cold-restart/*.log
            boot-evidence/cold-restart/*.png
            boot-evidence/cold-restart/*.json
            boot-evidence/cold-restart/*status.txt
            boot-evidence/fault-restart/*.log
            boot-evidence/fault-restart/*.png
            boot-evidence/fault-restart/*.json
            boot-evidence/fault-restart/*status.txt
            boot-evidence/torn-newest-restart/*.log
            boot-evidence/torn-newest-restart/*.png
            boot-evidence/torn-newest-restart/*.json
            boot-evidence/torn-newest-restart/*status.txt
            boot-evidence/divergent-restart/*.log
            boot-evidence/divergent-restart/*.png
            boot-evidence/divergent-restart/*.json
            boot-evidence/divergent-restart/*status.txt
          if-no-files-found: warn
          retention-days: 7
