name: Header parser CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Block original game assets in tracked files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|lvl|caf|pvr)$'; then
            echo 'Prohibited source asset detected in repository' >&2
            exit 1
          fi
      - name: Run asset-free unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
