name: He-Man Python and native C core CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Block original game assets in tracked files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|lvl|map|shape|ps2d|caf|pvr|png|jpe?g|wav|mp3|ogg)$'; then
            echo 'Prohibited source asset detected in repository' >&2
            exit 1
          fi
      - name: Run asset-free unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Host scene headless smoke test (no copyrighted assets)
        run: PYTHONPATH=src python -m heman_tools.host_demo --headless --ticks 180
      - name: Synthetic event interactions smoke test
        run: PYTHONPATH=src python -m heman_tools.events_demo --ticks 180
      - name: Event HUD host CLI smoke test (synthetic only)
        run: PYTHONPATH=src python -m heman_tools.host_demo --headless --interactions --ticks 180

  native:
    name: Native C99 core (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run source-only native scenarios
        run: sh native/run_tests.sh "${{ matrix.compiler }}"
      - name: Record synthetic mask CPU benchmark (non-gating)
        run: sh native/bench_mask_step.sh gcc

