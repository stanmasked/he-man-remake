name: Isolated minimal libnx guest NeXium probe

on:
  pull_request:
    paths:
      - '.github/workflows/switch-minimal-nexium.yml'
      - 'switch_minimal/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build isolated minimal NRO
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary game assets
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git ls-files | grep -Ei '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|png|jpe?g|wav|ogg|mp3|pvr)$'; then
            echo "Proprietary assets may not enter a public workflow" >&2
            exit 1
          fi
      - name: Compile minimal libnx guest NRO
        shell: bash
        run: |
          set -euo pipefail
          make -C switch_minimal clean all
          test -s switch_minimal/heman_minimal_guest_probe.nro
          test "$(dd if=switch_minimal/heman_minimal_guest_probe.nro bs=1 skip=16 count=4 2>/dev/null)" = NRO0
          sha256sum switch_minimal/heman_minimal_guest_probe.nro
      - name: Upload isolated guest NRO
        uses: actions/upload-artifact@v4
        with:
          name: heman-minimal-nexium-nro
          path: switch_minimal/heman_minimal_guest_probe.nro
          if-no-files-found: error
          retention-days: 7

  nexium-runtime:
    name: Check guest framebuffer vs NeXium splash
    needs: build-test
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heman-minimal-nexium-nro
          path: nros
      - name: Install software Vulkan and screenshot tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Retrieve the NeXium nightly binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          test "$asset_url" != null
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
          ldd "$emu_bin" || true
      - name: Launch graphic NRO and capture before/after right input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/nexium-profile
          sha256sum nros/heman_minimal_guest_probe.nro | tee runtime-evidence/nro-sha256.txt
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO="$PWD/nros/heman_minimal_guest_probe.nro"
          export LOG="$PWD/runtime-evidence/nexium.log"
          export EARLY="$PWD/runtime-evidence/early-25s.png"
          export BEFORE="$PWD/runtime-evidence/before.png"
          export IDLE="$PWD/runtime-evidence/idle.png"
          export AFTER="$PWD/runtime-evidence/after-right.png"
          # NeXium uses its own FileLogger, not RUST_LOG/stdout.
          # NEXIUM_DATA_ROOT is from nexium-common/src/paths.rs; it writes
          # the actual emulator state transitions into $root/logs/.
          export NEXIUM_DATA_ROOT="$PWD/runtime-evidence/nexium-profile"
          export NEXIUM_LOG_LEVEL="debug"
          export RUST_BACKTRACE="1"
          timeout --kill-after=5s 155s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
            pid=$!
            trap "kill -TERM $pid 2>/dev/null || true" EXIT
            for i in $(seq 1 75); do
              sleep 1
              state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
              if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                echo "NeXium exited before window capture" >&2
                tail -100 "$LOG" || true
                exit 1
              fi
              if [ "$i" -eq 25 ]; then
                early_window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
                if [ -n "$early_window" ]; then
                  timeout --kill-after=2s 10s import -window "$early_window" "$EARLY" || true
                fi
              fi
            done
            window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
            test -n "$window"
            timeout --kill-after=2s 10s import -window "$window" "$BEFORE"
            sleep 0.8
            timeout --kill-after=2s 10s import -window "$window" "$IDLE"
            timeout --kill-after=1s 3s xdotool windowfocus --sync "$window" || true
            timeout --kill-after=1s 4s xdotool keydown --window "$window" Right
            sleep 1.6
            timeout --kill-after=1s 4s xdotool keyup --window "$window" Right
            sleep 0.6
            timeout --kill-after=2s 10s import -window "$window" "$AFTER"
            test -s "$BEFORE"
            test -s "$IDLE"
            test -s "$AFTER"
          '
      - name: Collect real NeXium file logs
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-evidence/nexium-file-logs
          if [ -d runtime-evidence/nexium-profile/logs ]; then
            cp -a runtime-evidence/nexium-profile/logs/. runtime-evidence/nexium-file-logs/
          fi
          find runtime-evidence/nexium-file-logs -maxdepth 1 -type f -printf '%f %s bytes\\n' \\
            | tee runtime-evidence/log-inventory.txt
          for file in runtime-evidence/nexium-file-logs/*.log; do
            [ -f "$file" ] || continue
            echo "--- NeXium internal file log tail: $file ---"
            tail -n 120 "$file" || true
          done
      - name: Confirm fixed-color guest marker and input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee runtime-evidence/guest-marker-check.txt
          from PIL import Image

          names = ("before.png", "idle.png", "after-right.png")
          images = [
              Image.open("runtime-evidence/" + name).convert("RGB")
              for name in names
          ]
          if len({img.size for img in images}) != 1:
              raise SystemExit("NeXium changed screenshot dimensions")

          def guest_marker(image):
              # The guest fills a 110x100 framebuffer rectangle with
              # opaque FF00FF. The NeXium animated splash has NO such
              # solid region. A color-diversity test alone is invalid.
              w, h = image.size
              hits = []
              for yy in range(h):
                  for xx in range(w):
                      red, green, blue = image.getpixel((xx, yy))
                      if red > 220 and green < 40 and blue > 220:
                          hits.append((xx, yy))
              if len(hits) < 3000:
                  raise SystemExit(
                      f"Not guest content: solid-magenta pixels={len(hits)}"
                  )
              return sum(x for x, _ in hits) / len(hits), len(hits)

          values = [guest_marker(img) for img in images]
          for name, (x, n) in zip(names, values):
              print(f"{name}: guest marker x={x:.2f}, pixels={n}")
          start, idle, right = (v[0] for v in values)
          print(f"Idle drift={abs(idle-start):.2f}; Right offset={right-idle:.2f}")
          if abs(idle - start) > 10:
              raise SystemExit("Guest marker moved while no key was held")
          if right - idle < 40:
              raise SystemExit("Guest marker did not follow Right key")
          print("Verified guest framebuffer and directional input: PASS")
          PY
      - name: Publish actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heman-nexium-minimal-guest-evidence
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 7
