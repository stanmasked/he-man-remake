name: He-Man Stage255 descriptor-relative capture I/O
on:
  pull_request:
    paths:
      - 'tools/stage231_capture_session.py'
      - 'tools/stage243_bounded_evidence.py'
      - 'tools/stage240_private_emulator_launcher.py'
      - 'tools/stage252_runtime_preflight.py'
      - 'tools/stage253_preflight_launch_gate.py'
      - 'tests/test_stage231_capture_session.py'
      - 'tests/test_stage243_bounded_evidence.py'
      - 'tests/test_stage240_private_emulator_launcher.py'
      - 'tests/test_stage252_runtime_preflight.py'
      - 'tests/test_stage253_preflight_launch_gate.py'
      - 'docs/stage255-dirfd-capture-io.md'
      - '.github/workflows/stage255-dirfd-capture-io.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descriptor-relative-capture-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Pinned SD and session I/O regressions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private commercial assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private source assets must not enter public CI" >&2
            exit 1
          fi
      - name: Run Stage231 session and descriptor-relative I/O tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage231_capture_session.py' -v
      - name: Run Stage243 bounded evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage243_bounded_evidence.py' -v
      - name: Run Stage240 launcher regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage240_private_emulator_launcher.py' -v
      - name: Run Stage252 and Stage253 launch-gate regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage252_runtime_preflight.py' -v
          python -m unittest discover -s tests -p 'test_stage253_preflight_launch_gate.py' -v
      - name: Write synthetic-only Stage255 summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "schema": "heman-stage255-dirfd-capture-io-v1",
              "result": "synthetic_descriptor_io_tests_passed_not_runtime_evidence",
              "descriptor_relative_sd_prepare_io": True,
              "descriptor_relative_sd_collect_io": True,
              "no_follow_bounded_capture_reads": True,
              "race_path_replacement_regressions": True,
              "real_emulator_launch_performed": False,
              "runtime_gpu_execution_attested": False,
              "gpu_capability_independently_verified": False,
              "original_ios_graphics_parity_attested": False,
              "note": "Temporary synthetic fixtures only; no original game resources or real emulator."
          }
          Path("build/stage255_dirfd_capture_io_summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("STAGE255_SYNTHETIC_DESCRIPTOR_IO_SUMMARY_VALID")
          PY
      - name: Preserve synthetic Stage255 summary
        uses: actions/upload-artifact@v4
        with:
          name: heman-stage255-dirfd-capture-io
          path: build/stage255_dirfd_capture_io_summary.json
          if-no-files-found: error
          retention-days: 7
