name: He-Man real-time app-clock Switch NRO

on:
  pull_request:
    paths:
      - '.github/workflows/switch-realtime-clock-probe.yml'
      - 'switch_realtime_clock/**'
      - 'native/clock/heman_app_tick_clock.h'
      - 'native/clock/heman_app_tick_clock.c'
      - 'native/include/heman_app_tick_scheduler.h'
      - 'native/src/heman_app_tick_scheduler.c'
      - 'native/include/heman_sprite_clock.h'
      - 'native/src/heman_sprite_clock.c'
      - 'tools/instrument_nexium_frames.py'
      - 'tools/verify_nexium_realtime_clock_pngs.py'
      - 'patches/nexium-nro-segment-file-origin.patch'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-realtime-clock-nro:
    name: Cross-compile isolated real-time clock probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
      - name: Reject original game assets in Git tracking
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files > /tmp/heman-tracked-paths.txt
          if grep -Ei '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|lvl|map|shape|ps2d|caf|pvr|png|jpe?g|wav|mp3|ogg)$' /tmp/heman-tracked-paths.txt; then
            echo 'Original game assets are forbidden in this repository' >&2
            exit 1
          fi
      - name: Verify devkitPro toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -x "$DEVKITPRO/tools/bin/elf2nro"
          test -f "$DEVKITPRO/libnx/switch.specs"
          "$DEVKITA64/bin/aarch64-none-elf-gcc" --version | head -n 1
      - name: Build isolated real-time NRO
        shell: bash
        run: |
          set -euo pipefail
          make -C switch_realtime_clock clean all
          NRO=switch_realtime_clock/heman_realtime_clock_probe.nro
          ELF=switch_realtime_clock/heman_realtime_clock_probe.elf
          test -s "$NRO"
          test -s "$ELF"
          "$DEVKITA64/bin/aarch64-none-elf-readelf" -h "$ELF" | grep -F AArch64
          test "$(dd if="$NRO" bs=1 skip=16 count=4 2>/dev/null)" = NRO0
          sha256sum "$NRO"
          wc -c "$NRO"
      - name: Upload real-time clock probe
        uses: actions/upload-artifact@v4
        with:
          name: heman-realtime-app-clock-probe-nro
          path: switch_realtime_clock/heman_realtime_clock_probe.nro
          if-no-files-found: error
          retention-days: 7


  run-nexium-guest:
    name: Run real-time NRO in pinned NeXium and verify guest PASS
    needs: build-realtime-clock-nro
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      RUST_BACKTRACE: "1"
      NEXIUM_CPU_BACKEND: rustarmic
      NEXIUM_DEBUG_RUNNER_SECONDS: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heman-realtime-app-clock-probe-nro
          path: nros
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies for pinned NeXium and guest OCR
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libibus-1.0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libboost-dev libvulkan1 mesa-vulkan-drivers python3-pil tesseract-ocr
      - name: Checkout and patch pinned NeXium in a temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium-upstream
          git -C /tmp/nexium-upstream init -q
          git -C /tmp/nexium-upstream remote add origin https://github.com/nexium-emu/nexium.git
          git -C /tmp/nexium-upstream fetch --depth 1 origin b6149f647f1b0824e450555beb6cfc16b6f0e075
          git -C /tmp/nexium-upstream checkout -q --detach FETCH_HEAD
          git -C /tmp/nexium-upstream submodule update --init --depth 1
          git -C /tmp/nexium-upstream apply --check "$GITHUB_WORKSPACE/patches/nexium-nro-segment-file-origin.patch"
          git -C /tmp/nexium-upstream apply "$GITHUB_WORKSPACE/patches/nexium-nro-segment-file-origin.patch"
          python3 "$GITHUB_WORKSPACE/tools/instrument_nexium_frames.py" /tmp/nexium-upstream/nexium-gui/src/debug_boot.rs
          mkdir -p "$GITHUB_WORKSPACE/boot-evidence"
      - name: Build pinned NeXium guest runner
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nexium-upstream
          cargo build -p nexium-gui --bin debug_boot --no-default-features --features backend-rustarmic
          test -x target/debug/debug_boot
          cp target/debug/debug_boot "$GITHUB_WORKSPACE/boot-evidence/debug_boot"
          sha256sum "$GITHUB_WORKSPACE/boot-evidence/debug_boot"
      - name: Run real-time NRO and verify actual guest execution
        shell: bash
        run: |
          set -euo pipefail
          export NEXIUM_DATA_ROOT="$PWD/boot-evidence/nexium-data"
          export NEXIUM_DEBUG_BOOT_LOG="$PWD/boot-evidence/realtime-clock-runner.log"
          export HEMAN_FRAME_CAPTURE_DIR="$PWD/boot-evidence"
          export RUST_LOG="info,wgpu_core=warn"
          NRO="$PWD/nros/heman_realtime_clock_probe.nro"
          set +e
          timeout --kill-after=6s 95s boot-evidence/debug_boot "$NRO" rustarmic runner \
            >boot-evidence/realtime-clock-stdout.log 2>&1
          code=$?
          set -e
          echo "$code" > boot-evidence/realtime-clock-exit-status.txt
          tail -n 120 boot-evidence/realtime-clock-runner.log || true
          if [ "$code" -ne 0 ]; then
            echo "Patched NeXium real-time clock NRO failed with status $code" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("boot-evidence/realtime-clock-runner.log").read_text()
          if "Production runner complete" not in log:
              raise SystemExit("NeXium did not report normal guest-runner completion")
          matches = re.findall(r"cycles=(\d+) svcs=(\d+) frames=(\d+)", log)
          if not matches:
              raise SystemExit("No periodic guest CPU/SVC/frame progress was recorded")
          cycles = max(int(row[0]) for row in matches)
          svcs = max(int(row[1]) for row in matches)
          frames = max(int(row[2]) for row in matches)
          print(f"Guest progress: cycles={cycles}, SVCs={svcs}, frames={frames}")
          if cycles <= 0 or svcs <= 0 or frames < 300:
              raise SystemExit("Guest did not show sufficient CPU/SVC/frame progress")
          print("PASS: the real-time NRO executed as a guest in patched NeXium")
          PY
          python3 tools/verify_nexium_realtime_clock_pngs.py boot-evidence \
            | tee boot-evidence/realtime-clock-guest-report.json
      - name: Upload runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heman-nexium-realtime-clock-evidence
          path: |
            boot-evidence/*.log
            boot-evidence/*status.txt
            boot-evidence/*.png
            boot-evidence/*.json
            boot-evidence/debug_boot
          if-no-files-found: warn
          retention-days: 7
