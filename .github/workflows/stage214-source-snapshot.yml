name: Stage214 temporary source handoff

on:
  push:
    branches:
      - feature/heman-stage214-private-cpu-preview

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=he-man-remake/ HEAD > /tmp/he-man-remake-source.tar.gz
          test -s /tmp/he-man-remake-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: stage214-source-snapshot
          path: /tmp/he-man-remake-source.tar.gz
          if-no-files-found: error
          retention-days: 1
