name: He-Man Stage266 polygon alpha geometry evidence
on:
  pull_request:
    paths:
      - 'src/heman_tools/collision_polygon_alpha_parity.py'
      - 'tests/test_collision_polygon_alpha_parity.py'
      - 'docs/stage266-polygon-alpha-geometry.md'
      - '.github/workflows/stage266-polygon-alpha-geometry.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-polygon-alpha-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic PNG test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Reject any original game assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private game assets must not enter public CI" >&2
            exit 1
          fi
      - name: Run fabricated polygon versus PNG regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_collision_polygon_alpha_parity.py' -v
      - name: Emit synthetic-only capability statement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
            "schema": "heman-stage266-polygon-alpha-geometry-ci-v1",
            "result": "synthetic_polygon_alpha_tests_passed_not_original_evidence",
            "only_fabricated_shapes_map_tileset_and_png": True,
            "original_ipa_or_game_assets_loaded": False,
            "original_shape_vertices_or_alpha_arrays_exported": False,
            "original_runtime_geometry_loader_verified": False,
            "original_collisions_and_gameplay_parity_verified": False,
            "native_switch_collision_import_authorized": False
          }
          Path("build/stage266_synthetic_summary.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heman-stage266-synthetic-polygon-alpha-evidence
          path: build/stage266_synthetic_summary.json
          if-no-files-found: error
          retention-days: 7
