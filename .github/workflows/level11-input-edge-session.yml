name: He-Man original Level1-1 native-held-input edge session
on:
  pull_request:
    paths:
      - '.github/workflows/level11-input-edge-session.yml'
      - 'native/include/heman_level11_native_session.h'
      - 'native/include/heman_level11_native_contacts.h'
      - 'native/src/heman_level11_native_session.c'
      - 'native/src/heman_level11_native_contacts.c'
      - 'native/tests/test_level11_native_session.c'
      - 'native/run_tests.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-attack-edge:
    name: Held input and native lore session (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Check full hm_step session with ASan and UBSan
        env:
          CC: ${{ matrix.compiler }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        shell: bash
        run: |
          set -euo pipefail
          "$CC" -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I native/include \
            native/src/heman_core.c native/src/heman_mask.c \
            native/src/heman_level11_lore.c \
            native/src/heman_level11_native_contacts.c \
            native/src/heman_level11_native_session.c \
            native/tests/test_level11_native_session.c \
            -lm -o /tmp/heman-stage105-session
          /tmp/heman-stage105-session
      - name: Limit source-fidelity claims
        run: |
          echo 'This is source C99 movement in a fabricated objective layout.'
          echo 'The attack_down level comes from a synthetic host input.'
          echo 'No user-private IPA, original map or genuine iOS capture is in CI.'
