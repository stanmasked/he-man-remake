name: He-Man experimental original Level1-1 lore save and replay
on:
  pull_request:
    paths:
      - '.github/workflows/level11-lore-snapshot.yml'
      - 'native/include/heman_level11_snapshot.h'
      - 'native/src/heman_level11_snapshot.c'
      - 'native/src/heman_level11_native_contacts.c'
      - 'native/tests/test_level11_snapshot.c'
      - 'native/run_tests.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-native-lore-save:
    name: Native versioned save and gated Bio revisit (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify full C99 simulation save, restore and corruption rejection
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          "$CC" -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I native/include \
            native/src/heman_core.c native/src/heman_mask.c \
            native/src/heman_level11_lore.c \
            native/src/heman_level11_native_contacts.c \
            native/src/heman_level11_native_session.c \
            native/src/heman_level11_snapshot.c \
            native/tests/test_level11_snapshot.c \
            -lm -o /tmp/heman-stage108-save
          /tmp/heman-stage108-save
      - name: Confirm evidence limitations
        run: |
          echo 'No actual original iOS save schema or proprietary maps are read.'
          echo 'FNV accidental-corruption checksum is NOT cryptographic authenticity.'
          echo 'All C99 scene positions/fixtures are fictional test data.'
