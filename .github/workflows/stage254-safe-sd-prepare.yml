name: He-Man Stage254 safe SD capture preparation
on:
  pull_request:
    paths:
      - 'tools/stage231_capture_session.py'
      - 'tools/stage240_private_emulator_launcher.py'
      - 'tools/stage253_preflight_launch_gate.py'
      - 'tests/test_stage231_capture_session.py'
      - 'tests/test_stage240_private_emulator_launcher.py'
      - 'tests/test_stage253_preflight_launch_gate.py'
      - 'docs/stage254-safe-sd-prepare.md'
      - '.github/workflows/stage254-safe-sd-prepare.yml'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-sd-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Synthetic SD path safety and preparation regressions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private commercial assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(private_assets|original_assets|local_reports)/|\.(ipa|apk|obb|pvr|wav|mp3|ogg)$'; then
            echo "Private source assets must not enter public CI" >&2
            exit 1
          fi
      - name: Run Stage231 capture-session tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage231_capture_session.py' -v
      - name: Run Stage240 launcher regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage240_private_emulator_launcher.py' -v
      - name: Run Stage252 and Stage253 gate regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_stage252_runtime_preflight.py' -v
          python -m unittest discover -s tests -p 'test_stage253_preflight_launch_gate.py' -v
      - name: Write synthetic-only Stage254 summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "schema": "heman-stage254-safe-sd-prepare-v1",
              "result": "synthetic_path_safety_tests_passed_not_runtime_evidence",
              "stage231_rejects_symlinked_capture_directories": True,
              "stage231_session_output_rejects_symlink": True,
              "stage253_launch_gate_remains_required": True,
              "real_emulator_launch_performed": False,
              "runtime_gpu_execution_attested": False,
              "gpu_capability_independently_verified": False,
              "original_ios_graphics_parity_attested": False,
              "note": "Tests use temporary synthetic paths only; no original game resources or real emulator."
          }
          Path("build/stage254_safe_sd_prepare_summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("STAGE254_SYNTHETIC_SD_SAFETY_SUMMARY_VALID")
          PY
      - name: Preserve synthetic Stage254 summary
        uses: actions/upload-artifact@v4
        with:
          name: heman-stage254-safe-sd-prepare
          path: build/stage254_safe_sd_prepare_summary.json
          if-no-files-found: error
          retention-days: 7
